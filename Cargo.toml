# Nexa Clip — 크로스플랫폼 클립보드 매니저 (올 러스트 워크스페이스)
# 아키텍처 = docs/20 §5 · 결정 = docs/10 · 재사용 계획 = docs/13.
# 렌더·컨트롤(nclip-gfx·nclip-ctl)은 nexa-beep에서 가져와 **이 프로젝트 이름으로 흡수**했다
# (DR-15 정정 08-26 — 포크. 복사본 불변 규율 U-1은 함께 폐지).
# 크레이트 경계는 단방향(역참조 금지) — 어댑터가 nclip-core에 의존한다.
# 외부 crate 기본 0 지향(DR-8) — 추가는 docs/10 §3 원장에 건별 기록.
[workspace]
resolver = "2"
members = [
  "crates/nclip-core",         # 도메인 + 포트 + i18n (허브 — nclip 의존 0)
  "crates/nclip-gfx",          # CPU 래스터라이저·텍스트 스택 (의존 0)
  "crates/nclip-ctl",          # 커스텀 컨트롤 한 벌 (앱 도메인 의존 0)
  "crates/nclip-plat",         # 플랫폼 경계 — 클립보드 감시·전역 단축키·포커스/주입·트레이
  "crates/nclip-store",        # 영속 — 암호화 세그먼트·내용 주소 blob
  "crates/nclip-ui",           # 화면 S1~S8
  "crates/nclip-imgdec",       # (bin) 이미지 격리 디코드 워커 — 파서는 여기에만(beep R-5)
  "crates/nexa-conf",          # 설정 영속 — ★ nexa 계열 공용(nclip 의존 0 · DR-32)
  "crates/nexa-clip",          # (bin) 진입·조립·생명주기
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
authors = ["Sangyong Bae <kiros33@gmail.com>"]
repository = "https://github.com/SosomLab/nexa-clip"
homepage = "https://sosomlab.com"

# 워크스페이스 공통 린트 — 각 크레이트가 [lints] workspace = true로 상속.
[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
redundant_clone = "warn"
inefficient_to_string = "warn"
# 프로덕션 경로 unwrap/expect 금지 — 테스트는 각 크레이트에서 허용.
unwrap_used = "warn"

[workspace.dependencies]
nclip-core = { path = "crates/nclip-core" }
nexa-conf = { path = "crates/nexa-conf" }
nclip-gfx = { path = "crates/nclip-gfx" }
nclip-ctl = { path = "crates/nclip-ctl" }
nclip-plat = { path = "crates/nclip-plat" }
nclip-store = { path = "crates/nclip-store" }
nclip-ui = { path = "crates/nclip-ui" }

# 릴리스 = 예산 게이트(DR-9 — 상주 앱). 수치는 ADR-0001에서 확정.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# ★ debug 빌드에서도 암호 원어는 최적화한다(T-16 · 08-31 실기 "시작 수 초 블록") —
#   ChaCha20-Poly1305가 opt-level 0에선 ~10MB/s라 blob 복원이 시작을 잡아먹는다.
#   release는 무관 · 테스트/실기 체감만 바꾼다.
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.universal-hash]
opt-level = 3
[profile.dev.package.aead]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.inout]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
# ★ AEAD 제네릭은 "호출한 크레이트"에 단형화된다 — 원어 크레이트만 올려선 소용없고
#   (실측 5MB/s 그대로), 호출측인 nclip-store가 opt 3이어야 dev에서도 212MB/s가 나온다.
[profile.dev.package.nclip-store]
opt-level = 3
