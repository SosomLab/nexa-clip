# Nexa Clip — 크로스플랫폼 클립보드 매니저 (올 러스트 워크스페이스)
# 아키텍처 = docs/20 §5 · 결정 = docs/10 · 재사용 계획 = docs/13.
# ★ 렌더·컨트롤·설정 영속·글꼴 발견은 계열 공용 라이브러리 **nexa-ui**(형제 저장소 `../nexa-ui` · path 의존)를 쓴다(10-10 · DR-47).
#   계보: nexa-gfx ← nclip-gfx ← nbeep-gfx · nexa-ctl ← nclip-ctl ← nbeep-ctl · nexa-conf = 사본과 동일 본문 · nexa-font ← nclip-plat/font.rs.
#   clone 시 `../nexa-ui`·`../nexa-license`를 나란히 둔다(docs/18 §1) · CI는 SosomLab/nexa-ui·nexa-license를 형제 경로로 체크아웃한다.
# 크레이트 경계는 단방향(역참조 금지) — 어댑터가 nclip-core에 의존한다.
# 외부 crate 기본 0 지향(DR-8) — 추가는 docs/10 §3 원장에 건별 기록.
[workspace]
resolver = "2"
members = [
  "crates/nclip-core",         # 도메인 + 포트 + i18n (허브 — nclip 의존 0)
  "crates/nclip-plat",         # 플랫폼 경계 — 클립보드 감시·전역 단축키·포커스/주입·트레이
  "crates/nclip-store",        # 영속 — 암호화 세그먼트·내용 주소 blob
  "crates/nclip-sync",         # ★ M2 동기화 기반 — 신원·랑데부 파생·릴레이 클라이언트(09-03)
  "crates/nclip-ui",           # 화면 S1~S8
  "crates/nclip-imgdec",       # (bin) 이미지 격리 디코드 워커 — 파서는 여기에만(beep R-5)
  "crates/nclip-license",      # ★ 라이선스 앱 층(10-10 · nexa-license 위 얇은 층 · beep nbeep-license 복제)
  "crates/nexa-clip",          # (bin) 진입·조립·생명주기
]

[workspace.package]
version = "0.1.9"
edition = "2021"
rust-version = "1.82"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
authors = ["Sangyong Bae <kiros33@gmail.com>"]
repository = "https://github.com/SosomLab/nexa-clip"
homepage = "https://sosomlab.com"

# 워크스페이스 공통 린트 — 각 크레이트가 [lints] workspace = true로 상속.
[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
redundant_clone = "warn"
inefficient_to_string = "warn"
# 프로덕션 경로 unwrap/expect 금지 — 테스트는 각 크레이트에서 허용.
unwrap_used = "warn"

[workspace.dependencies]
nclip-core = { path = "crates/nclip-core" }
# ★ nexa-ui(계열 공용 UI 라이브러리 · 10-10 DR-47) — **형제 저장소 path 의존**(nexa-beep·nexa-sql·nexa-dir3와 같은 방식).
nexa-gfx = { path = "../nexa-ui/crates/nexa-gfx" }
nexa-ctl = { path = "../nexa-ui/crates/nexa-ctl" }
nexa-conf = { path = "../nexa-ui/crates/nexa-conf" }
nexa-font = { path = "../nexa-ui/crates/nexa-font" }
nexa-sys = { path = "../nexa-ui/crates/nexa-sys", default-features = false } # OS 신호(locale — `app.lang=system` · 10-10)
nexa-dlg = { path = "../nexa-ui/crates/nexa-dlg" } # 파일 선택 대화상자(3-OS 자체 · 10-10 P3 · 라이선스 파일 열기)
# ★ nexa-license(계열 공용 라이선스 검증 · 10-10 P4) — 형제 저장소 path 의존 · 검증 전용(issuer 금지).
nexa-license = { path = "../nexa-license/crates/nexa-license" }
nclip-license = { path = "crates/nclip-license" }
nclip-plat = { path = "crates/nclip-plat" }
nclip-store = { path = "crates/nclip-store" }
nclip-ui = { path = "crates/nclip-ui" }

# 릴리스 = 예산 게이트(DR-9 — 상주 앱). 수치는 ADR-0001에서 확정.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# ★ debug 빌드에서도 암호 원어는 최적화한다(T-16 · 08-31 실기 "시작 수 초 블록") —
#   ChaCha20-Poly1305가 opt-level 0에선 ~10MB/s라 blob 복원이 시작을 잡아먹는다.
#   release는 무관 · 테스트/실기 체감만 바꾼다.
[profile.dev.package.chacha20poly1305]
opt-level = 3
# ★ nclip-sync — PBKDF2 반복이 호출 크레이트에 단형화된다(nclip-store AEAD 교훈 동일).
[profile.dev.package.nclip-sync]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.universal-hash]
opt-level = 3
[profile.dev.package.aead]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.inout]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
# ★ AEAD 제네릭은 "호출한 크레이트"에 단형화된다 — 원어 크레이트만 올려선 소용없고
#   (실측 5MB/s 그대로), 호출측인 nclip-store가 opt 3이어야 dev에서도 212MB/s가 나온다.
[profile.dev.package.nclip-store]
opt-level = 3
